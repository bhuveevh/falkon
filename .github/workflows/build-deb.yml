name: Build Debian package

# Builds this Falkon fork and produces an installable .deb.
# Runs inside a Debian container that has KDE Frameworks 6 and Qt 6 WebEngine.

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gettext python3 \
            extra-cmake-modules \
            qt6-base-dev qt6-base-dev-tools qt6-webengine-dev qt6-webchannel-dev \
            qt6-declarative-dev qt6-tools-dev qt6-svg-dev libqt6sql6-sqlite \
            libkf6archive-dev libkf6i18n-dev libkf6wallet-dev libkf6kio-dev \
            libkf6crash-dev libkf6coreaddons-dev libkf6purpose-dev libkf6jobwidgets-dev \
            libssl-dev libxcb1-dev libxcb-util-dev \
            dpkg-dev

      - name: Apply Polecat UI customisations
        run: python3 .github/apply-polecat-ui.py

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Stage install
        run: DESTDIR="$PWD/stage" cmake --install build

      - name: Package the .deb
        run: sh .github/make-deb.sh "1.0.0.${GITHUB_RUN_NUMBER}"

      - name: Show what was built
        run: |
          ls -la *.deb
          dpkg-deb --info *.deb | head -22

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: polecat-falkon-deb
          path: '*.deb'
          if-no-files-found: error
